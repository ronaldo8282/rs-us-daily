# Daily IBD-style US RS ranker.
# Goal: full-universe CSV + dated history before Daily scan ~07:56 Asia/Hong_Kong.
# US cash equity close ~20:00 UTC → run 21:30 UTC (05:30 HKT next morning).
name: daily-rs-us

on:
  schedule:
    # Mon–Fri 21:30 UTC ≈ 05:30 HKT next calendar day
    - cron: "30 21 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rank:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Rank full universe + history archive
        run: |
          mkdir -p output/history reports
          # Full .info is too slow; fill MarketCap only for Percentile>=90 (overlap needs it).
          python src/rank_rs.py --out output/rs_stocks.csv --fetch-info-pct 90 --history-dir output/history
          # Fallback archive by asof_date if script did not write one
          if ! ls output/history/rs_stocks_*.csv >/dev/null 2>&1; then
            ASOF=$(python -c "import pandas as pd; print(str(pd.read_csv('output/rs_stocks.csv')['asof_date'].iloc[0]).replace('-',''))")
            cp output/rs_stocks.csv "output/history/rs_stocks_${ASOF}.csv"
          fi

      - name: Append Friday wide ranks (Fridays only)
        continue-on-error: true
        run: python src/append_friday_wide.py --src output/rs_stocks.csv --out-dir output/friday

      - name: Update fundamentals (best-effort batch)
        continue-on-error: true
        run: |
          # Resume fill; cap per day so the job still finishes under timeout.
          python src/update_fundamentals.py --resume --limit 400 --prioritize-friday

      - name: Sync Pages data copies
        continue-on-error: true
        run: |
          mkdir -p docs/data
          cp -f output/friday/rs_friday_ranks.csv docs/data/rs_friday_ranks.csv
          cp -f output/friday/rs_friday_percentiles.csv docs/data/rs_friday_percentiles.csv
          if [ -f output/fundamentals_latest.csv ]; then
            cp -f output/fundamentals_latest.csv docs/data/fundamentals_latest.csv
          else
            echo 'Ticker,Sector,Industry,MarketCap,updated_at' > docs/data/fundamentals_latest.csv
          fi


      - name: Market breadth MM (Stockbee-inspired MVP)
        continue-on-error: true
        run: |
          mkdir -p output/mm
          python src/mm_breadth.py --out output/mm/mm_breadth_daily.csv --rewrite-days 15

      - name: Overlap vs Fred (best-effort)
        continue-on-error: true
        run: python src/overlap_vs_fred.py --ours output/rs_stocks.csv

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: rs-stocks
          path: |
            output/rs_stocks.csv
            output/history/
            output/friday/
            output/mm/
            output/fundamentals_latest.csv
            docs/data/
            reports/
          if-no-files-found: warn

      - name: Commit latest + history + docs (if changed)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output/rs_stocks.csv output/history/ output/friday/ output/mm/ output/fundamentals_latest.csv docs/ reports/ || true
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: daily RS ranks $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull --rebase origin main || git pull --rebase --autostash origin main
            git push
          fi
